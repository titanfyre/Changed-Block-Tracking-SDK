[build-system]
requires=["setuptools>=77","wheel>=0.43"]
build-backend="setuptools.build_meta"
[project]
name="changed-block-tracking-sdk"
version="1.0.0"
description="Windows x64 Changed-Block-Tracking-SDK direct SDK"
requires-python=">=3.10"
license="MIT"
readme="README.md"
[project.urls]
Repository="https://github.com/titanfyre/Changed-Block-Tracking-SDK"
[tool.setuptools]
packages=["changed_block_tracking_sdk"]
[tool.setuptools.package-data]
changed_block_tracking_sdk=["*.dll"]
[tool.setuptools.data-files]
"share/changed-block-tracking-sdk/docs"=["docs/*","LICENSE"]
